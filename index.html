    }, true);

    function hasPendingOperator(str) {
      return /[+\-×÷]/.test(String(str || ''));
    }

    function computeExpressionValue(expr) {
      if (!expr) return 0;
      let clean = String(expr)
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/−/g, '-');
      clean = clean.replace(/[+\-*/.]+$/, '');
      if (!clean) return 0;
      if (!/^[0-9+\-*/.() ]+$/.test(clean)) return 0;
      try {
        const val = Function('"use strict"; return (' + clean + ')')();
        if (typeof val === 'number' && isFinite(val)) {
          return Math.max(0, Math.round(val));
        }
      } catch (e) {}
      return 0;
    }

    function evaluateCurrentExpression() {
      if (!calcInput) return 0;
      const cleanExpr = String(calcInput).replace(/[+\-×÷.]+$/, '');
      const val = computeExpressionValue(cleanExpr);
      if (hasPendingOperator(cleanExpr)) {
        calcLastFormula = cleanExpr + ' =';
      }
      calcInput = val > 0 ? String(val) : '';
      return val;
    }

    function formatCalcInputForDisplay(raw) {
      if (!raw) return '0';
      return String(raw).replace(/\d+(\.\d+)?/g, function(numStr) {
        const parts = numStr.split('.');
        const intFormatted = Number(parts[0]).toLocaleString();
        return parts.length > 1 ? `${intFormatted}.${parts[1]}` : intFormatted;
      });
    }

    function updateCalcDisplay() {
      const previewEl = document.getElementById('calc-expr-preview');
      const displayEl = document.getElementById('amount-display-val');
      const doneEqBtn = document.getElementById('btn-calc-done-eq');

      previewEl.textContent = calcLastFormula || '';

      if (!calcInput) {
        displayEl.textContent = '0';
        displayEl.classList.add('placeholder');
        displayEl.classList.remove('long-expr');
      } else {
        const formatted = formatCalcInputForDisplay(calcInput);
        displayEl.textContent = formatted;
        displayEl.classList.remove('placeholder');
        if (formatted.length > 11) {
          displayEl.classList.add('long-expr');
        } else {
          displayEl.classList.remove('long-expr');
        }
      }

      if (doneEqBtn) {
        const isReadyToEqual = hasPendingOperator(calcInput) && /\d$/.test(calcInput);
        doneEqBtn.textContent = isReadyToEqual ? '=' : 'OK';
      }
    }

    function handleCalcPad(e, key) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      const ops = ['+', '-', '×', '÷'];

      if (key === 'AC') {
        clearPresetSelectionHighlight();
        calcInput = '';
        calcLastFormula = '';
        updateCalcDisplay();
        return;
      }

      if (key === 'BACK') {
        clearPresetSelectionHighlight();
        if (calcInput.length > 0) {
          calcInput = calcInput.slice(0, -1);
        } else {
          calcLastFormula = '';
        }
        updateCalcDisplay();
        return;
      }

      if (key === 'DONE_EQ') {
        const isReadyToEqual = hasPendingOperator(calcInput) && /\d$/.test(calcInput);
        if (isReadyToEqual) {
          evaluateCurrentExpression();
          updateCalcDisplay();
        } else {
          closeCalcKeyboard();
        }
        return;
      }

      clearPresetSelectionHighlight();

      if (ops.includes(key)) {
        if (!calcInput) return;
        const lastCh = calcInput.slice(-1);
        if (ops.includes(lastCh)) {
          calcInput = calcInput.slice(0, -1) + key;
        } else {
          calcInput += key;
        }
        updateCalcDisplay();
        return;
      }

      if (key === '.') {
        const parts = calcInput.split(/[+\-×÷]/);
        const curNum = parts[parts.length - 1];
        if (!curNum.includes('.')) {
          calcInput += (curNum === '' ? '0.' : '.');
        }
        updateCalcDisplay();
        return;
      }

      if (calcLastFormula && !hasPendingOperator(calcInput)) {
        calcLastFormula = '';
      }
      const parts = calcInput.split(/[+\-×÷]/);
      const curNum = parts[parts.length - 1];

      if (key === '00') {
        if (!curNum || curNum === '0') {
          if (!curNum) calcInput += '0';
        } else if (curNum.replace('.', '').length <= 7) {
          calcInput += '00';
        }
        updateCalcDisplay();
        return;
      }

      if (curNum === '0') {
        calcInput = calcInput.slice(0, -1) + key;
      } else if (curNum.replace('.', '').length < 9) {
        calcInput += key;
      }
      updateCalcDisplay();
    }

    function setAmountFromPreset(amt) {
      calcLastFormula = '';
      calcInput = String(amt);
      updateCalcDisplay();
    }

    // ========= 核心資料重算（錢包 + 存錢筒獨立計算） =========
    function sortAndComputeLogs(logsArray, isPiggy) {
      const totalLen = logsArray.length;
      logsArray.forEach((item, i) => {
        if (!item.id) {
          item.id = (isPiggy ? 'piggy_' : 'log_') + (Date.now() - i) + '_' + i;
        }
        if (typeof item.seq !== 'number') {
          item.seq = totalLen - i;
        }
      });

      logsArray.sort((a, b) => {
        const dayA = String(a.date || '').split(' ')[0];
        const dayB = String(b.date || '').split(' ')[0];
        if (dayA !== dayB) {
          return dayB.localeCompare(dayA);
        }
        return (Number(b.seq) || 0) - (Number(a.seq) || 0);
      });

      const chronological = [...logsArray].reverse();
      let runningRem = 0;
      let runningTot = 0;
      let lastClearIdx = -1;

      chronological.forEach((item, idx) => {
        const amt = Math.abs(Number(item.amount) || 0);
        item.amount = amt;
        if (item.type === '清空') {
          runningRem = 0;
          runningTot = 0;
          item.categoryOrNote = item.categoryOrNote || '執行清存';
          item.payment = '';
          item.memo = '';
          lastClearIdx = idx;
        } else if (item.type === '收入') {
          runningTot += amt;
          runningRem += amt;
          item.payment = '';
          item.memo = '';
        } else if (item.type === '支出') {
          runningRem -= amt;
        }
        item.remaining = runningRem;
        item.total = runningTot;
      });

      return {
        sortedLogs: chronological.reverse(),
        runningRem,
        runningTot,
        lastClearIdx,
        chronological
      };
    }

    function recalculateState() {
      if (!Array.isArray(appState.categories) || appState.categories.length === 0) {
        appState.categories = ['餐飲', '娛樂（遊戲）', '娛樂（其他）', '網路'];
      }
      if (!appState.categories.includes('餐飲')) {
        appState.categories.unshift('餐飲');
      }
      if (!Array.isArray(appState.payments) || appState.payments.length === 0) {
        appState.payments = ['現金', '悠遊卡', '行動支付', '銀行帳戶'];
      }
      if (!appState.payments.includes('現金')) {
        appState.payments.unshift('現金');
      }
      if (!Array.isArray(appState.presets)) {
        appState.presets = [];
      }
      if (!Array.isArray(appState.logs)) {
        appState.logs = [];
      }
      if (!Array.isArray(appState.piggyLogs)) {
        appState.piggyLogs = [];
      }
      if (!Array.isArray(appState.cycleSummaries)) {
        appState.cycleSummaries = [];
      }

      // 錢包重算（同步動態重建 cycleSummaries 週期歸檔，確保刪除紀錄／刪除清存／上一步皆完全一致）
      const walletRes = sortAndComputeLogs(appState.logs, false);
      appState.currentRemaining = walletRes.runningRem;
      appState.currentTotal = walletRes.runningTot;

      const rebuiltCycles = [];
      let cStart = '', cEnd = '', cBudget = 0, cExpense = 0, cRem = 0;
      walletRes.chronological.forEach(item => {
        if (item.type === '清空') {
          const settledDay = String(item.date || '').split(' ')[0] || '';
          rebuiltCycles.push({
            id: item.cycleId || ('cycle_' + item.id),
            startDate: cStart || settledDay,
            endDate: cEnd || settledDay,
            totalBudget: cBudget,
            totalExpense: cExpense,
            remaining: cRem,
            settledAt: item.date || ''
          });
          cStart = '';
          cEnd = '';
          cBudget = 0;
          cExpense = 0;
          cRem = 0;
        } else {
          const dk = String(item.date || '').split(' ')[0] || '';
          const amt = Math.abs(Number(item.amount) || 0);
          if (dk) {
            if (!cStart || dk < cStart) cStart = dk;
            if (!cEnd || dk > cEnd) cEnd = dk;
          }
          if (item.type === '收入') {
            cBudget += amt;
            cRem += amt;
          } else if (item.type === '支出') {
            cExpense += amt;
            cRem -= amt;
          }
        }
      });
      appState.cycleSummaries = rebuiltCycles.reverse();

      const pieStats = {};
      for (let i = walletRes.lastClearIdx + 1; i < walletRes.chronological.length; i++) {
        const item = walletRes.chronological[i];
        if (item.type === '支出') {
          const rawCat = String(item.categoryOrNote || '未分類');
          const baseCat = rawCat.split('（')[0] || '未分類';
          pieStats[baseCat] = (pieStats[baseCat] || 0) + (Number(item.amount) || 0);
        }
      }
      appState.pieStats = pieStats;
      appState.logs = walletRes.sortedLogs;

      // 存錢筒重算
      const piggyRes = sortAndComputeLogs(appState.piggyLogs, true);
      appState.piggyRemaining = piggyRes.runningRem;
      appState.piggyLogs = piggyRes.sortedLogs;
    }

    function calculateTodaySpend() {
      const todayPrefix = getTodayDateKey();
      let sum = 0;
      const logs = appState.logs || [];
      for (let i = 0; i < logs.length; i++) {
        const item = logs[i];
        if (item.type === '清空') {
          break;
        }
        if (item.type === '支出' && String(item.date || '').startsWith(todayPrefix)) {
          sum += Number(item.amount) || 0;
        }
      }
      return sum;
    }

    function getNextSeqNumber(targetList) {
      const list = targetList || appState.logs || [];
      let maxSeq = 0;
      list.forEach(item => {
        if (typeof item.seq === 'number' && item.seq > maxSeq) {
          maxSeq = item.seq;
        }
      });
      return maxSeq + 1;
    }

    function createSnapshotObject(viewContext = null) {
      const snap = JSON.parse(JSON.stringify({
        categories: appState.categories,
        payments: appState.payments,
        presets: appState.presets,
        logs: appState.logs,
        piggyLogs: appState.piggyLogs,
        cycleSummaries: appState.cycleSummaries
      }));
      if (viewContext) {
        snap.viewContext = JSON.parse(JSON.stringify(viewContext));
      }
      return snap;
    }

    function applySnapshotObject(snap) {
      if (!snap) return;
      appState.categories = JSON.parse(JSON.stringify(snap.categories || ['餐飲', '娛樂（遊戲）', '娛樂（其他）', '網路']));
      appState.payments = JSON.parse(JSON.stringify(snap.payments || ['現金', '悠遊卡', '行動支付', '銀行帳戶']));
      appState.presets = JSON.parse(JSON.stringify(snap.presets || []));
      appState.logs = JSON.parse(JSON.stringify(snap.logs || []));
      appState.piggyLogs = JSON.parse(JSON.stringify(snap.piggyLogs || []));
      appState.cycleSummaries = JSON.parse(JSON.stringify(snap.cycleSummaries || []));
      recalculateState();
    }

    function persistToLocalStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          categories: appState.categories,
          payments: appState.payments,
          presets: appState.presets,
          logs: appState.logs,
          piggyLogs: appState.piggyLogs,
          cycleSummaries: appState.cycleSummaries
        }));
        localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify({
          stack: historyStack,
          pointer: historyPointer
        }));
      } catch (e) {
        console.error('寫入 LocalStorage 失敗:', e);
      }
    }

    function pushHistoryStep(viewContext = null) {
      const snap = createSnapshotObject(viewContext);
      if (historyPointer < historyStack.length - 1) {
        historyStack = historyStack.slice(0, historyPointer + 1);
      }
      historyStack.push(snap);
      if (historyStack.length > MAX_HISTORY_STEPS) {
        historyStack.shift();
      }
      historyPointer = historyStack.length - 1;
      persistToLocalStorage();
      updateUndoRedoButtonsUI();
    }

    function commitChangeWithVersion(viewContext = null) {
      recalculateState();
      pushHistoryStep(viewContext);
    }

    function handleUndoStep() {
      if (historyPointer <= 0) return;
      historyPointer--;
      const snap = historyStack[historyPointer];
      applySnapshotObject(snap);
      persistToLocalStorage();
      applyViewContextFromSnapshot(snap);
    }

    function handleRedoStep() {
      if (historyPointer >= historyStack.length - 1) return;
      historyPointer++;
      const snap = historyStack[historyPointer];
      applySnapshotObject(snap);
      persistToLocalStorage();
      applyViewContextFromSnapshot(snap);
    }

    function updateUndoRedoButtonsUI() {
      const btnUndo = document.getElementById('btn-undo-step');
      const btnRedo = document.getElementById('btn-redo-step');
      if (btnUndo) btnUndo.disabled = (historyPointer <= 0);
      if (btnRedo) btnRedo.disabled = (historyPointer >= historyStack.length - 1);
    }

    function loadStateFromLocal() {
      try {
        const rawHist = localStorage.getItem(HISTORY_STORAGE_KEY);
        if (rawHist) {
          const parsedHist = JSON.parse(rawHist);
          if (parsedHist && Array.isArray(parsedHist.stack) && parsedHist.stack.length > 0) {
            historyStack = parsedHist.stack;
            historyPointer = typeof parsedHist.pointer === 'number'
              ? Math.min(Math.max(0, parsedHist.pointer), historyStack.length - 1)
              : historyStack.length - 1;
            applySnapshotObject(historyStack[historyPointer]);
            updateUndoRedoButtonsUI();
            return;
          }
        }

        const rawState = localStorage.getItem(STORAGE_KEY);
        if (rawState) {
          const parsed = JSON.parse(rawState);
          if (parsed && typeof parsed === 'object') {
            appState.categories = Array.isArray(parsed.categories) ? parsed.categories : appState.categories;
            appState.payments = Array.isArray(parsed.payments) ? parsed.payments : appState.payments;
            appState.presets = Array.isArray(parsed.presets) ? parsed.presets : [];
            appState.logs = Array.isArray(parsed.logs) ? parsed.logs : [];
            appState.piggyLogs = Array.isArray(parsed.piggyLogs) ? parsed.piggyLogs : [];
            appState.cycleSummaries = Array.isArray(parsed.cycleSummaries) ? parsed.cycleSummaries : [];
          }
        }
        recalculateState();
      } catch (e) {
        console.error('讀取 LocalStorage 失敗:', e);
      }

      historyStack = [createSnapshotObject()];
      historyPointer = 0;
      persistToLocalStorage();
      updateUndoRedoButtonsUI();
    }

    function applyMergeImport(source) {
      const existingWalletIds = new Set((appState.logs || []).map(x => x && x.id).filter(Boolean));
      const existingPiggyIds = new Set((appState.piggyLogs || []).map(x => x && x.id).filter(Boolean));

      let addedWallet = 0;
      (source.logs || []).forEach(item => {
        if (!item) return;
        if (item.id && existingWalletIds.has(item.id)) return;
        const copy = JSON.parse(JSON.stringify(item));
        if (!copy.id) copy.id = 'imp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
        existingWalletIds.add(copy.id);
        appState.logs.push(copy);
        addedWallet++;
      });

      let addedPiggy = 0;
      (Array.isArray(source.piggyLogs) ? source.piggyLogs : []).forEach(item => {
        if (!item) return;
        if (item.id && existingPiggyIds.has(item.id)) return;
        const copy = JSON.parse(JSON.stringify(item));
        if (!copy.id) copy.id = 'imp_p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
        existingPiggyIds.add(copy.id);
        appState.piggyLogs.push(copy);
        addedPiggy++;
      });

      if (Array.isArray(source.categories)) {
        source.categories.forEach(c => {
          if (c && !appState.categories.includes(c)) appState.categories.push(c);
        });
      }
      if (Array.isArray(source.payments)) {
        source.payments.forEach(pm => {
          if (pm && !appState.payments.includes(pm)) appState.payments.push(pm);
        });
      }
      let addedPresets = 0;
      if (Array.isArray(source.presets)) {
        const existingNames = new Set((appState.presets || []).map(pr => String((pr && (pr.name || pr.label)) || '').trim()));
        source.presets.forEach(pr => {
          const pName = String((pr && (pr.name || pr.label)) || '').trim();
          if (pName && !existingNames.has(pName)) {
            existingNames.add(pName);
            const copyPr = JSON.parse(JSON.stringify(pr));
            copyPr.name = pName;
            appState.presets.push(copyPr);
            addedPresets++;
          }
        });
      }
      if (Array.isArray(source.cycleSummaries)) {
        const existingCycleKeys = new Set((appState.cycleSummaries || []).map(cs => String(cs.id || cs.endDate || '')));
        source.cycleSummaries.forEach(cs => {
          const ck = String((cs && (cs.id || cs.endDate)) || '');
          if (ck && !existingCycleKeys.has(ck)) {
            existingCycleKeys.add(ck);
            appState.cycleSummaries.push(JSON.parse(JSON.stringify(cs)));
          }
        });
      }

      selectedPresetIndex = null;
      commitChangeWithVersion();
      renderAll();

      if (addedWallet === 0 && addedPiggy === 0 && addedPresets === 0) {
        showAppAlert('匯入檔案與現存紀錄完全相符，沒有需要新增的項目。');
      } else {
        const presetNote = addedPresets > 0 ? `、${addedPresets} 項常用選項` : '';
        showAppAlert(`已無衝突並成功合併匯入！\n新增 ${addedWallet} 筆錢包紀錄、${addedPiggy} 筆存錢筒紀錄${presetNote}。`);
      }
    }

    function detectImportConflicts(source) {
      const conflicts = [];

      const walletById = new Map();
      (appState.logs || []).forEach(item => {
        if (item && item.id) walletById.set(item.id, item);
      });
      (source.logs || []).forEach(item => {
        if (item && item.id && walletById.has(item.id)) {
          const cur = walletById.get(item.id);
          if (normalizeLogSignature(cur) !== normalizeLogSignature(item)) {
            conflicts.push(`錢包紀錄（${String(item.date || '').split(' ')[0]} ${item.categoryOrNote || item.type || ''}）內容不一致`);
          }
        }
      });

      const piggyById = new Map();
      (appState.piggyLogs || []).forEach(item => {
        if (item && item.id) piggyById.set(item.id, item);
      });
      (Array.isArray(source.piggyLogs) ? source.piggyLogs : []).forEach(item => {
        if (item && item.id && piggyById.has(item.id)) {
          const cur = piggyById.get(item.id);
          if (normalizeLogSignature(cur) !== normalizeLogSignature(item)) {
            conflicts.push(`存錢筒紀錄（${String(item.date || '').split(' ')[0]} ${item.categoryOrNote || item.type || ''}）內容不一致`);
          }
        }
      });

      if (Array.isArray(source.presets)) {
        const presetByName = new Map();
        (appState.presets || []).forEach(pr => {
          const pName = String((pr && (pr.name || pr.label)) || '').trim();
          if (pName) presetByName.set(pName, pr);
        });
        source.presets.forEach(pr => {
          const pName = String((pr && (pr.name || pr.label)) || '').trim();
          if (pName && presetByName.has(pName)) {
            const cur = presetByName.get(pName);
            if (String(cur.category || '') !== String(pr.category || '') || (Number(cur.amount) || 0) !== (Number(pr.amount) || 0)) {
              conflicts.push(`常用選項「${pName}」設定不一致`);
            }
          }
        });
      }

      if (Array.isArray(source.cycleSummaries)) {
        const cycleByKey = new Map();
        (appState.cycleSummaries || []).forEach(cs => {
          const ck = String((cs && (cs.id || cs.endDate)) || '');
          if (ck) cycleByKey.set(ck, cs);
        });
        source.cycleSummaries.forEach(cs => {
          const ck = String((cs && (cs.id || cs.endDate)) || '');
          if (ck && cycleByKey.has(ck)) {
            const cur = cycleByKey.get(ck);
            if (JSON.stringify(cur) !== JSON.stringify(cs)) {
              conflicts.push(`清存歸檔（${cs.endDate || ck}）數據不一致`);
            }
          }
        });
      }

      return conflicts;
    }

    function handleImportFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          const source = (parsed && parsed.data && Array.isArray(parsed.data.logs)) ? parsed.data : parsed;

          if (!source || !Array.isArray(source.logs)) {
            showAppAlert('匯入失敗：此檔案格式不正確，找不到記帳紀錄資料。');
            return;
          }

          const conflicts = detectImportConflicts(source);
          if (conflicts.length === 0) {
            applyMergeImport(source);
            return;
          }

          const previewList = conflicts.slice(0, 3).join('、') + (conflicts.length > 3 ? ` 等共 ${conflicts.length} 項` : '');
          showAppConfirm(
            `偵測到「${file.name}」與現存紀錄有衝突：\n${previewList}\n\n是否要以匯入檔案「取代覆蓋」目前的分類、常用選項與所有記帳資料？`,
            () => applyOverwriteImport(parsed, source)
          );
        } catch (err) {
          showAppAlert('匯入失敗：無法解析檔案內容，請確認選擇的是正確的 .json 備份檔。');
        }
      };
      reader.readAsText(file, 'UTF-8');
    }

    function attachEdgeSwipeBack(modalEl, onCloseFn) {
      if (!modalEl) return;
      let startX = 0, startY = 0, dx = 0, isEdge = false, isHoriz = null;

      modalEl.addEventListener('touchstart', function(e) {
        if (!e.touches || e.touches.length !== 1) return;
        const t = e.touches[0];
        if (t.clientX <= 48) {
          isEdge = true;
          startX = t.clientX;
          startY = t.clientY;
          dx = 0;
          isHoriz = null;
          modalEl.style.transition = 'none';
        } else {
          isEdge = false;
        }
      }, { passive: true });

      modalEl.addEventListener('touchmove', function(e) {
        if (!isEdge || !e.touches || e.touches.length !== 1) return;
        const curX = e.touches[0].clientX - startX;
        const curY = e.touches[0].clientY - startY;
        if (isHoriz === null) {
          if (Math.abs(curX) > 6 || Math.abs(curY) > 6) {
            isHoriz = (curX > 0 && Math.abs(curX) > Math.abs(curY));
            if (!isHoriz) {
              isEdge = false;
              return;
            }
          }
        }
        if (!isHoriz) return;
        if (e.cancelable) e.preventDefault();
        dx = Math.max(0, curX);
        modalEl.style.transform = `translateX(${dx}px)`;
      }, { passive: false });

      modalEl.addEventListener('touchend', function() {
        if (!isEdge) return;
        isEdge = false;
        modalEl.style.transition = 'transform 0.28s cubic-bezier(0.32, 0.72, 0, 1)';
        const threshold = Math.min(110, (window.innerWidth || 360) * 0.28);
        if (dx > threshold) {
          modalEl.style.transform = 'translateX(100%)';
          setTimeout(() => {
            modalEl.style.transition = 'none';
            modalEl.style.transform = '';
            onCloseFn();
          }, 260);
        } else {
          modalEl.style.transform = 'translateX(0px)';
          setTimeout(() => {
            modalEl.style.transition = 'none';
            modalEl.style.transform = '';
          }, 280);
        }
      });
    }

    function renderDailySpendSheetContent() {
      const listEl = document.getElementById('daily-sheet-list');
      listEl.innerHTML = '';

      const logs = appState.logs || [];
      if (logs.length === 0) {
        listEl.innerHTML = '<div class="empty-hint" style="padding:32px 0;">尚無任何支出紀錄</div>';
        return;
      }

      const groups = [];
      let currentDayGroup = null;

      logs.forEach(item => {
        if (item.type === '清空') {
          if (currentDayGroup) {
            groups.push(currentDayGroup);
            currentDayGroup = null;
          }
          groups.push({ isClear: true, date: item.date });
          return;
        }

        if (item.type === '支出') {
          const dayKey = String(item.date || '').split(' ')[0] || '未知日期';
          if (!currentDayGroup || currentDayGroup.dayKey !== dayKey) {
            if (currentDayGroup) groups.push(currentDayGroup);
            currentDayGroup = { isClear: false, dayKey: dayKey, total: 0 };
          }
          currentDayGroup.total += Number(item.amount) || 0;
        }
      });
      if (currentDayGroup) groups.push(currentDayGroup);

      const hasAnyExpense = groups.some(g => !g.isClear);
      if (!hasAnyExpense) {
        listEl.innerHTML = '<div class="empty-hint" style="padding:32px 0;">尚無任何支出紀錄</div>';
        return;
      }

      groups.forEach(g => {
        const div = document.createElement('div');
        if (g.isClear) {
          div.className = 'daily-sheet-clear';
          div.innerHTML = `
            <span>執行清存</span>
            <span>${formatDateWithWeekday(g.date)}</span>
          `;
        } else {
          const wd = getWeekdayFromDatePart(g.dayKey);
          div.className = 'daily-sheet-row';
          div.innerHTML = `
            <div class="daily-sheet-date">
              <span>${g.dayKey}</span>
              <span class="daily-sheet-weekday">星期${wd}</span>
            </div>
            <div class="daily-sheet-amt">-${g.total.toLocaleString()} 元</div>
          `;
        }
        listEl.appendChild(div);
      });
    }

    // ========= 渲染概覽頁 =========
    function renderOverview() {
      const rem = Number(appState.currentRemaining || 0);
      const tot = Number(appState.currentTotal || 0);
      const piggyRem = Number(appState.piggyRemaining || 0);

      const remEl = document.getElementById('overview-rem');
      const totEl = document.getElementById('overview-tot');
      remEl.textContent = rem.toLocaleString() + ' 元';
      totEl.textContent = tot.toLocaleString() + ' 元';
      if (rem < 0) {
        remEl.classList.add('negative');
      } else {
        remEl.classList.remove('negative');
      }

      const piggyValEl = document.getElementById('overview-piggy-val');
      if (piggyValEl) {
        piggyValEl.textContent = piggyRem.toLocaleString() + ' 元';
        if (piggyRem < 0) {
          piggyValEl.classList.add('negative');
        } else {
          piggyValEl.classList.remove('negative');
        }
      }

      const todaySpend = calculateTodaySpend();
      document.getElementById('overview-today').textContent = todaySpend.toLocaleString() + ' 元';

      const pieStats = appState.pieStats || {};
      const entries = Object.entries(pieStats)
        .map(([cat, amt]) => ({ cat, amt: Number(amt) || 0 }))
        .filter(item => item.amt > 0)
        .sort((a, b) => b.amt - a.amt);

      const totalSpent = entries.reduce((acc, cur) => acc + cur.amt, 0);

      document.getElementById('burn-spent-val').textContent = `${totalSpent.toLocaleString()} 元`;
      document.getElementById('burn-budget-val').textContent = `${tot.toLocaleString()} 元`;

      const mainTrackEl = document.getElementById('main-progress-track');
      let rawMainPct = 0;
      if (tot > 0) {
        rawMainPct = (totalSpent / tot) * 100;
      } else if (totalSpent > 0) {
        rawMainPct = 100;
      }
      const barWidthMainPct = Math.min(100, rawMainPct);
      const displayMainPct = Math.round(rawMainPct);
      const isOverBudget = (tot > 0 && totalSpent > tot);
      const mainFillClass = isOverBudget ? 'thick-bar-fill over-budget' : 'thick-bar-fill';

      if (totalSpent === 0) {
        mainTrackEl.innerHTML = `
          <div class="${mainFillClass}" style="width: 0%;"></div>
          <span class="bar-label-outside" style="color: var(--muted);">0%</span>
        `;
      } else if (barWidthMainPct >= 16) {
        mainTrackEl.innerHTML = `
          <div class="${mainFillClass}" style="width: ${barWidthMainPct}%;">
            <span class="bar-label-inside">${displayMainPct}%</span>
          </div>
        `;
      } else {
        mainTrackEl.innerHTML = `
          <div class="${mainFillClass}" style="width: ${barWidthMainPct}%;"></div>
          <span class="bar-label-outside">${displayMainPct}%</span>
        `;
      }

      const pieContainer = document.getElementById('pie-container');
      const canvas = document.getElementById('pieChart');
      const emptyEl = document.getElementById('chart-empty');

      if (entries.length === 0 || typeof Chart === 'undefined') {
        pieContainer.style.display = 'none';
        emptyEl.style.display = 'block';
        if (pieChartInstance) {
          pieChartInstance.destroy();
          pieChartInstance = null;
        }
        return;
      }

      pieContainer.style.display = 'flex';
      emptyEl.style.display = 'none';

      if (pieChartInstance) {
        pieChartInstance.destroy();
        pieChartInstance = null;
      }

      const rawLabels = entries.map(e => e.cat);
      const values = entries.map(e => e.amt);
      const fullLabels = entries.map(e => {
        const pct = totalSpent > 0 ? Math.round((e.amt / totalSpent) * 100) : 0;
        return `${e.cat} ${e.amt.toLocaleString()}元 (${pct}%)`;
      });

      const alwaysShowSliceLabelPlugin = {
        id: 'alwaysShowSliceLabel',
        afterDatasetsDraw(chart) {
          const { ctx } = chart;
          const meta = chart.getDatasetMeta(0);
          if (!meta || !meta.data) return;

          ctx.save();
          ctx.fillStyle = '#FDFCF9';
          ctx.font = '600 11px -apple-system, BlinkMacSystemFont, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          meta.data.forEach((arc, index) => {
            const val = values[index];
            const pct = totalSpent > 0 ? Math.round((val / totalSpent) * 100) : 0;
            if (pct < 6) return;

            const pos = arc.tooltipPosition();
            const catName = rawLabels[index];
            ctx.fillText(`${catName} ${pct}%`, pos.x, pos.y - 6);
            ctx.fillText(`${val.toLocaleString()}元`, pos.x, pos.y + 7);
          });
          ctx.restore();
        }
      };

      pieChartInstance = new Chart(canvas, {
        type: 'pie',
        data: {
          labels: fullLabels,
          datasets: [{
            data: values,
            backgroundColor: EARTH_PALETTE,
            borderWidth: 1.5,
            borderColor: '#FDFCF9'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: {
            padding: 4
          },
          plugins: {
            legend: {

    function submitRecord() {
      if (isSubmittingRecord) return;
      closeCalcKeyboard();
      const amount = Math.abs(Number(computeExpressionValue(calcInput)) || 0);
      if (!amount || amount <= 0) {
        showAppAlert('請輸入大於 0 的金額');

      const dateInputVal = document.getElementById('input-record-date').value || getTodayIsoDate();
      const selectedSlashDate = dateInputVal.replace(/-/g, '/');
      const todaySlashDate = getTodayDateKey();

      const finalDateStr = (selectedSlashDate === todaySlashDate)
        ? `${selectedSlashDate} ${getNowTimePart()}`
        : selectedSlashDate;

      const isExpense = (currentMode === '支出');
      const targetAccount = isExpense
        ? document.getElementById('select-expense-source').value
        : document.getElementById('select-income-target').value;
      const isPiggy = (targetAccount === '存錢筒');
      const targetLogs = isPiggy ? appState.piggyLogs : appState.logs;

      const newLog = {
        id: (isPiggy ? 'piggy_' : 'log_') + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        seq: getNextSeqNumber(targetLogs),

        type: currentMode,

        remaining: 0,
        total: 0,
        memo: ''

        const customMemo = document.getElementById('input-expense-memo').value.trim();
        newLog.categoryOrNote = selectedCat;
        newLog.payment = document.getElementById('select-payment').value;

        if (selectedPresetIndex !== null && appState.presets[selectedPresetIndex]) {
          const presetName = appState.presets[selectedPresetIndex].name;
          if (!customMemo || customMemo === presetName) {
            newLog.memo = presetName;

      isSubmittingRecord = true;
      const submitBtn = document.querySelector('.btn-submit');
      const okClass = isExpense ? 'submit-ok-exp' : 'submit-ok-inc';
      if (submitBtn) {
        submitBtn.textContent = '已記帳 ✓';

        currentCycleLogs.push(item);

    function parseExpenseDisplay(item) {
      let rawCat = String(item.categoryOrNote || '');
      let baseCat = rawCat;
      let presetNote = '';

      const match = rawCat.match(/^(.+?)（(.+)）$/);
      if (match) {
        baseCat = match[1];
        presetNote = match[2];
      }

      let extraMemo = String(item.memo || '').trim();
      let combinedNote = '';
      if (presetNote && extraMemo && presetNote !== extraMemo) {
        combinedNote = `${presetNote}・${extraMemo}`;
      } else {
        combinedNote = presetNote || extraMemo;
      }

      return { baseCat, combinedNote };
    }

    // ========= 紀錄頁搜尋比對邏輯 =========
    function matchSearchQuery(item, rawQuery) {
      if (!item || item.type === '清空') return false;
      const q = String(rawQuery || '').trim();
      if (!q) return false;

      const datePart = String(item.date || '').split(' ')[0] || '';
      const dateSegments = datePart.split('/');
      const monthNum = dateSegments.length >= 2 ? Number(dateSegments[1]) : NaN;
      const dayNum = dateSegments.length >= 3 ? Number(dateSegments[2]) : NaN;
      const amtStr = String(Math.abs(Number(item.amount) || 0));

      const yuanMatch = q.match(/^(\d+)元$/);
      if (yuanMatch) {
        return amtStr.includes(yuanMatch[1]);
      }

      const monthMatch = q.match(/^(\d{1,2})月$/);
      if (monthMatch) {
        return !isNaN(monthNum) && monthNum === Number(monthMatch[1]);
      }

      const dayMatch = q.match(/^(\d{1,2})[日號]$/);
      if (dayMatch) {
        return !isNaN(dayNum) && dayNum === Number(dayMatch[1]);
      }

      if (/^\d+$/.test(q)) {
        return amtStr.includes(q) || datePart.includes(q);
      }

      const qLower = q.toLowerCase();
      const fields = [
        item.categoryOrNote || '',
        item.memo || '',
        item.payment || ''
      ];
      return fields.some(f => String(f).toLowerCase().includes(qLower));
    }

    function closeAnyOpenSwipeItem(exceptWrapper) {

    function attachSwipeHandler(wrapper, fgEl, logId, deleteFn, onTapFn) {
      let startX = 0;
      let startY = 0;
      let currentX = 0;
      let baseOffset = 0;
      let isDragging = false;
      let isHorizontal = null;
      let moved = false;

      fgEl.addEventListener('touchstart', function(e) {
        if (!e.touches || e.touches.length !== 1) return;
        closeAnyOpenSwipeItem(wrapper);
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        baseOffset = wrapper.classList.contains('open') ? -78 : 0;
        currentX = baseOffset;
        isDragging = true;
        isHorizontal = null;
        moved = false;
        fgEl.style.transition = 'none';
      }, { passive: true });

      fgEl.addEventListener('touchmove', function(e) {
        if (!isDragging || !e.touches || e.touches.length !== 1) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;

        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;

        if (isHorizontal === null) {
          if (Math.abs(dx) > 6 || Math.abs(dy) > 6) {
            isHorizontal = Math.abs(dx) > Math.abs(dy);
          }
        }
        if (!isHorizontal) return;

        if (e.cancelable) e.preventDefault();
        wrapper.classList.add('swiping');
        currentX = Math.min(0, baseOffset + dx);
        fgEl.style.transform = `translateX(${currentX}px)`;
      }, { passive: false });

      fgEl.addEventListener('touchend', function() {
        if (!isDragging) return;
        isDragging = false;
        fgEl.style.transition = 'transform 0.22s cubic-bezier(0.16, 1, 0.3, 1)';
        const fullWidth = wrapper.offsetWidth || 320;

        if (currentX < -fullWidth * 0.45) {
          fgEl.style.transform = `translateX(-${fullWidth}px)`;
          setTimeout(() => {
            deleteFn(logId);
          }, 160);
        } else if (currentX < -38) {
          fgEl.style.transform = 'translateX(-78px)';
          wrapper.classList.add('open');
          wrapper.classList.remove('swiping');
          currentOpenSwipeWrapper = wrapper;
        } else {
          fgEl.style.transform = 'translateX(0px)';
          wrapper.classList.remove('open', 'swiping');
          if (currentOpenSwipeWrapper === wrapper) currentOpenSwipeWrapper = null;
        }
      });

      if (typeof onTapFn === 'function') {
        fgEl.addEventListener('click', function() {
          if (wrapper.classList.contains('open') || moved) return;
          onTapFn(logId);
        });
      }
    }

          <div class="log-right">
            <div class="log-amt income">+${item.amount.toLocaleString()} 元</div>
            <div class="log-rem">餘額 ${item.remaining.toLocaleString()} 元</div>
          </div>
        `;
      } else {
        const { baseCat, combinedNote } = parseExpenseDisplay(item);
        const noteSpanHtml = combinedNote
          ? `<span class="log-note-inline">${combinedNote}</span>`
          : '';
        const badgeHtml = item.payment ? `<span class="badge-pay">${item.payment}</span>` : '';

        div.innerHTML = `
          <div class="log-left">
            <div class="log-title">
              <span class="log-cat-name">${baseCat}</span>
              ${badgeHtml}
              ${noteSpanHtml}
            </div>
            <div class="log-date">${formattedFullDate}</div>
          </div>
          <div class="log-right">
            <div class="log-amt expense">-${item.amount.toLocaleString()} 元</div>
            <div class="log-rem">餘額 ${item.remaining.toLocaleString()} 元</div>
          </div>
        `;
      }
      return div;
    }

    function renderLogListInto(listEl, logs, deleteFn, emptyText) {
      listEl.innerHTML = '';
      currentOpenSwipeWrapper = null;

      if (!logs || logs.length === 0) {
        listEl.innerHTML = `<div class="empty-hint">${emptyText}</div>`;
        return;
      }

      const todayKey = getTodayDateKey();
      const blocks = [];
      let currentBlock = null;

      logs.forEach(item => {
        if (item.type === '清空') {
          if (currentBlock) {
            blocks.push(currentBlock);
            currentBlock = null;
          }
          blocks.push({ isClear: true, item: item });
          return;
        }

        const dayKey = String(item.date || '').split(' ')[0] || '';
        if (!currentBlock || currentBlock.dayKey !== dayKey) {
          if (currentBlock) blocks.push(currentBlock);
          currentBlock = {
            isClear: false,
            dayKey: dayKey,
            expenseSum: 0,
            items: []
          };
        }
        if (item.type === '支出') {
          currentBlock.expenseSum += Number(item.amount) || 0;
        }
        currentBlock.items.push(item);
      });
      if (currentBlock) blocks.push(currentBlock);

      let lastAppendedWrapper = null;

      blocks.forEach(block => {
        if (block.isClear) {
          if (lastAppendedWrapper) {
            lastAppendedWrapper.classList.add('no-bottom-border');
          }
          const wrapper = document.createElement('div');
          wrapper.className = 'swipe-item-wrapper clear-wrapper';
          wrapper.setAttribute('data-log-id', block.item.id);

          const delBg = document.createElement('div');
          delBg.className = 'swipe-delete-bg';
          delBg.textContent = '刪除';
          delBg.onclick = () => deleteFn(block.item.id);

          const div = document.createElement('div');
          div.className = 'log-item clear-event';
          div.innerHTML = `
            <span style="font-size:12px; font-weight:600; color:var(--muted); letter-spacing:0.5px;">執行清存</span>
            <span class="log-date">${formatDateWithWeekday(block.item.date)}</span>
          `;

          wrapper.appendChild(delBg);
          wrapper.appendChild(div);
          attachSwipeHandler(wrapper, div, block.item.id, deleteFn, null);
          listEl.appendChild(wrapper);
          lastAppendedWrapper = null;
          return;
        }

        const isDayFinished = (block.dayKey && block.dayKey < todayKey);
        if (isDayFinished) {
          if (lastAppendedWrapper) {
            lastAppendedWrapper.classList.add('no-bottom-border');
          }
          const divider = document.createElement('div');
          divider.className = 'day-summary-divider';
          divider.innerHTML = `
            <div class="day-summary-line"></div>
            <div class="day-summary-pill">
              ${formatDayOnlyWithWeekday(block.dayKey)} 支出 <b>${block.expenseSum.toLocaleString()} 元</b>
            </div>
            <div class="day-summary-line"></div>
          `;
          listEl.appendChild(divider);
        }

        block.items.forEach(item => {
          const wrapper = document.createElement('div');
          wrapper.className = 'swipe-item-wrapper';
          wrapper.setAttribute('data-log-id', item.id);
          wrapper.setAttribute('data-log-day', String(item.date || '').split(' ')[0] || '');
          wrapper.setAttribute('data-log-type', item.type || '');

          const delBg = document.createElement('div');
          delBg.className = 'swipe-delete-bg';
          delBg.textContent = '刪除';
          delBg.onclick = () => deleteFn(item.id);

          const div = buildLogItemContent(item);

          wrapper.appendChild(delBg);
          wrapper.appendChild(div);
          attachSwipeHandler(wrapper, div, item.id, deleteFn, null);
          listEl.appendChild(wrapper);
          lastAppendedWrapper = wrapper;
        });
      });
    }

    function renderSearchResultsInto(listEl, sourceLogs, query, modeTab, deleteFn, onJumpFn) {
      listEl.innerHTML = '';
      currentOpenSwipeWrapper = null;

      const filtered = (sourceLogs || []).filter(item =>
        item.type === modeTab && matchSearchQuery(item, query)
      );

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="empty-hint">找不到符合「${query}」的${modeTab}紀錄</div>`;
        return;

      filtered.forEach(item => {
        const wrapper = document.createElement('div');
        wrapper.className = 'swipe-item-wrapper search-result-row';
        wrapper.setAttribute('data-log-id', item.id);

        const delBg = document.createElement('div');
        delBg.className = 'swipe-delete-bg';
        delBg.textContent = '刪除';
        delBg.onclick = (e) => {
          e.stopPropagation();
          deleteFn(item.id);
        };

        const div = buildLogItemContent(item);

        wrapper.appendChild(delBg);
        wrapper.appendChild(div);
        attachSwipeHandler(wrapper, div, item.id, deleteFn, onJumpFn);
        listEl.appendChild(wrapper);
      });
    }

    // ========= 4. 統計頁面邏輯與原生 SVG 圖表繪製 =========
    function setStatsFilter(type, value, btnEl) {

      const parent = document.getElementById(parentId);

    function setStatsRankMode(mode) {

    let currentPeakDayInfo = { amount: 0, date: '', ledger: '' };

    function getCurrentCycleWalletLogs() {
      const res = [];
      for (let i = 0; i < (appState.logs || []).length; i++) {
        const item = appState.logs[i];
        if (item.type === '清空' || item.type === 'clear') break;
        res.push(item);
      }
      return res;
    }

    function isInternalClearTransfer(item) {
      if (!item) return false;
      if (item.isClearTransfer === true) return true;
      if (item.categoryOrNote === '剩錢存入') return true;
      if (item.categoryOrNote === '透支存錢' && item.payment === '錢包結算') return true;
      return false;
    }

    function getStatsDateWindow(ledger, range, validLogs) {
      const todayKey = getTodayDateKey();
      const todayDt = parseDateKeyToObj(todayKey);
      let startDt = new Date(todayDt);

      if (range === '7d') {
        startDt.setDate(todayDt.getDate() - 6);
        return { startDate: formatObjToDateKey(startDt), endDate: todayKey, totalDays: 7 };
      }
      if (range === '30d') {
        startDt.setDate(todayDt.getDate() - 29);
        return { startDate: formatObjToDateKey(startDt), endDate: todayKey, totalDays: 30 };
      }
      if (range === '6m') {
        startDt = new Date(todayDt.getFullYear(), todayDt.getMonth() - 5, 1);
        const diff = Math.round((todayDt - startDt) / 86400000) + 1;
        return { startDate: formatObjToDateKey(startDt), endDate: todayKey, totalDays: Math.max(1, diff) };
      }
      // 本輪（cycle）與全部（all）：取所選帳本（本輪內）最早有效紀錄日期
      const dates = (validLogs || []).map(x => String(x.date || '').split(' ')[0]).filter(Boolean).sort();
      if (dates.length > 0) {
        const eDt = parseDateKeyToObj(dates[0]);
        if (eDt && eDt <= todayDt) {
          const diff = Math.round((todayDt - eDt) / 86400000) + 1;
          return { startDate: dates[0], endDate: todayKey, totalDays: Math.max(1, diff) };
        }
      }
      return { startDate: todayKey, endDate: todayKey, totalDays: 1 };
    }

    function getFilteredStatsData() {
      let rawPool = [];
      if (statsState.ledger === 'wallet') {
        const base = (statsState.range === 'cycle') ? getCurrentCycleWalletLogs() : (appState.logs || []);
        rawPool = base.map(item => ({ ...item, _ledger: '錢包' }));
      } else if (statsState.ledger === 'piggy') {
        rawPool = (appState.piggyLogs || []).map(item => ({ ...item, _ledger: '存錢筒' }));
      } else {
        const wBase = (statsState.range === 'cycle') ? getCurrentCycleWalletLogs() : (appState.logs || []);
        const wLogs = wBase.map(item => ({ ...item, _ledger: '錢包' }));
        const pLogs = (appState.piggyLogs || [])
          .filter(item => !isInternalClearTransfer(item))
          .map(item => ({ ...item, _ledger: '存錢筒' }));
        rawPool = wLogs.concat(pLogs);
      }

      // 排除系統標記（清空/clear）與 excludeStats === true
      const validPool = rawPool.filter(item =>
        (item.type === '支出' || item.type === '收入') && item.excludeStats !== true
      );

      const win = getStatsDateWindow(statsState.ledger, statsState.range, validPool);
      const logs = validPool.filter(item => {
        const dk = String(item.date || '').split(' ')[0];
        return dk && dk >= win.startDate && dk <= win.endDate;
      });

      return { logs, window: win };
    }

    function getFilteredStatsLogs() {
      return getFilteredStatsData().logs;
    }

    function renderStatsPage() {
      const { logs, window: win } = getFilteredStatsData();
      renderStatsKPIs(logs, win);
      renderStatsRankCard(logs);
      renderStatsTrendChart(logs, win);
      syncAllStatsSliders();
    }

    function computeEffectiveDailyAvgStats(logs) {
      const todayKey = getTodayDateKey();
      const todayDt = parseDateKeyToObj(todayKey);
      const yesterdayDt = new Date(todayDt);
      yesterdayDt.setDate(todayDt.getDate() - 1);
      const yesterdayKey = formatObjToDateKey(yesterdayDt);

      const expLogs = (logs || []).filter(item => item.type === '支出' && item.excludeStats !== true);
      const expDates = expLogs
        .map(item => String(item.date || '').split(' ')[0])
        .filter(Boolean)
        .sort();

      if (expDates.length === 0) {
        return { hasExpense: false, avgDaily: 0, days: 0, label: '日均支出', sub: '尚無支出' };
      }

      const startExpDay = expDates[0];
      const startDt = parseDateKeyToObj(startExpDay);

      if (!startDt || startExpDay >= todayKey || startDt > yesterdayDt) {
        let todayExp = 0;
        expLogs.forEach(item => {
          if (String(item.date || '').split(' ')[0] === todayKey) {
            todayExp += Math.abs(Number(item.amount) || 0);
          }
        });
        return {
          hasExpense: true,
          avgDaily: Math.round(todayExp),
          days: 1,
          label: '日均支出',
          sub: '1天日均'
        };
      }

      const fullDays = Math.max(1, Math.round((yesterdayDt - startDt) / 86400000) + 1);
      let expUntilYesterday = 0;
      expLogs.forEach(item => {
        const dk = String(item.date || '').split(' ')[0];
        if (dk && dk >= startExpDay && dk <= yesterdayKey) {
          expUntilYesterday += Math.abs(Number(item.amount) || 0);
        }
      });

      return {
        hasExpense: true,
        avgDaily: Math.round(expUntilYesterday / fullDays),
        days: fullDays,
        label: '日均支出',
        sub: `${fullDays}天日均`
      };
    }

    function renderStatsKPIs(logs, win) {
      let totalExp = 0;
      let totalInc = 0;
      const daySpendMap = {};

      logs.forEach(item => {
        const dayKey = String(item.date || '').split(' ')[0];
        const amt = Math.abs(Number(item.amount) || 0);
        if (item.type === '支出') {
          totalExp += amt;
          if (dayKey) daySpendMap[dayKey] = (daySpendMap[dayKey] || 0) + amt;
        } else if (item.type === '收入') {
          totalInc += amt;
        }
      });

      const avgStats = computeEffectiveDailyAvgStats(logs);
      const avgLabelEl = document.getElementById('kpi-avg-label');
      const avgEl = document.getElementById('kpi-avg-spend');
      const avgSubEl = document.getElementById('kpi-avg-sub');
      if (avgLabelEl) avgLabelEl.textContent = avgStats.label;
      avgEl.textContent = `${avgStats.avgDaily.toLocaleString()} 元`;
      avgSubEl.textContent = avgStats.sub;

      let peakAmt = 0;
      let peakDate = '';
      Object.entries(daySpendMap).forEach(([dk, val]) => {
        if (val > peakAmt || (val === peakAmt && val > 0 && dk > peakDate)) {
          peakAmt = val;
          peakDate = dk;
        }
      });

      currentPeakDayInfo = { amount: peakAmt, date: peakDate, ledger: statsState.ledger };
      const peakCard = document.getElementById('kpi-peak-card');
      if (peakCard) {
        peakCard.classList.toggle('clickable', peakAmt > 0);
      }
      document.getElementById('kpi-peak-spend').textContent = `${peakAmt.toLocaleString()} 元`;
      document.getElementById('kpi-peak-date').textContent = peakDate ? peakDate.slice(5) : '尚無資料';

      const net = totalInc - totalExp;
      const rateEl = document.getElementById('kpi-save-rate');
      if (totalInc <= 0) {
        rateEl.textContent = '—';
        rateEl.className = 'stats-kpi-val ' + (net < 0 ? 'expense' : '');
      } else {
        const pct = Math.round((net / totalInc) * 100);
        rateEl.textContent = `${pct}%`;
        rateEl.className = 'stats-kpi-val ' + (pct >= 0 ? 'income' : 'expense');
      }
      document.getElementById('kpi-net-sub').textContent = `淨額 ${net >= 0 ? '+' : ''}${net.toLocaleString()} 元`;
    }

    function jumpToPeakSpendDay() {
      if (!currentPeakDayInfo || currentPeakDayInfo.amount <= 0 || !currentPeakDayInfo.date) return;
      const targetDate = currentPeakDayInfo.date;

      const walletPool = (statsState.range === 'cycle') ? getCurrentCycleWalletLogs() : (appState.logs || []);
      const walletDayItems = walletPool.filter(item =>
        item.type === '支出' && item.excludeStats !== true && String(item.date || '').split(' ')[0] === targetDate
      );
      const piggyDayItems = (appState.piggyLogs || []).filter(item =>
        item.type === '支出' && item.excludeStats !== true &&
        (statsState.ledger !== 'all' || !isInternalClearTransfer(item)) &&
        String(item.date || '').split(' ')[0] === targetDate
      );

      let goPiggy = false;
      if (statsState.ledger === 'piggy') {
        goPiggy = true;
      } else if (statsState.ledger === 'all') {
        const wSum = walletDayItems.reduce((s, x) => s + (Number(x.amount) || 0), 0);
        const pSum = piggyDayItems.reduce((s, x) => s + (Number(x.amount) || 0), 0);
        if (pSum > wSum) goPiggy = true;
      }

      if (goPiggy) {
        const targetLog = piggyDayItems[0];
        if (!targetLog) return;
        openPiggyBankModal();
        const scrollBox = document.getElementById('piggy-scroll-body');
        setTimeout(() => {
          scrollToAndHighlightLog('piggy-log-list', targetLog.id, scrollBox, targetDate);
        }, 60);
        return;
      }

      const walletMatch = walletDayItems[0];
      if (!walletMatch) return;

      const statsMainCtx = {
        mode: 'stats_main',
        ledger: statsState.ledger,
        range: statsState.range,
        rankMode: statsState.rankMode,
        scrollTop: window.scrollY || 0
      };
      const curSnap = historyStack[historyPointer];
      if (curSnap && curSnap.viewContext && curSnap.viewContext.mode === 'stats_main') {
        curSnap.viewContext = statsMainCtx;
        if (historyPointer < historyStack.length - 1) {
          historyStack = historyStack.slice(0, historyPointer + 1);
        }
      } else {
        pushHistoryStep(statsMainCtx);
      }
      pushHistoryStep({ mode: 'history', highlightLogId: walletMatch.id, highlightDate: targetDate });

      walletSearchState.active = false;
      resetSearchBarInput('wallet');
      switchTab('history', document.querySelectorAll('.nav-tab')[2], true);
      setTimeout(() => {
        scrollToAndHighlightLog('log-list', walletMatch.id, null, targetDate);
      }, 90);
    }

    // 圖表 2：每日／每月收支趨勢長條圖（補齊區間所有日／月 + 固定高度均線）
    let currentTrendBuckets = [];
    let activeTrendBucketIdx = null;
    function renderStatsTrendChart(logs, win) {
      const wrap = document.getElementById('stats-trend-svg-wrap');
      const detail = document.getElementById('stats-trend-detail');
      detail.classList.remove('active', 'clickable');
      detail.removeAttribute('onclick');
      detail.innerHTML = '';
      activeTrendBucketIdx = null;

      const useMonthly = (statsState.range === '6m') || (statsState.range === 'all' && win.totalDays > 45);
      document.getElementById('trend-card-title').textContent = useMonthly
        ? '每月收支趨勢'
        : '每日收支趨勢';

      const bucketMap = {};
      if (useMonthly) {
        const sDt = parseDateKeyToObj(win.startDate);
        const eDt = parseDateKeyToObj(win.endDate);
        if (sDt && eDt) {
          const cur = new Date(sDt.getFullYear(), sDt.getMonth(), 1);
          const endM = new Date(eDt.getFullYear(), eDt.getMonth(), 1);
          while (cur <= endM) {
            const mKey = `${cur.getFullYear()}/${String(cur.getMonth() + 1).padStart(2, '0')}`;
            bucketMap[mKey] = { key: mKey, inc: 0, exp: 0 };
            cur.setMonth(cur.getMonth() + 1);
          }
        }
      } else {
        const sDt = parseDateKeyToObj(win.startDate);
        const eDt = parseDateKeyToObj(win.endDate);
        if (sDt && eDt) {
          const cur = new Date(sDt);
          while (cur <= eDt) {
            const dKey = formatObjToDateKey(cur);
            bucketMap[dKey] = { key: dKey, inc: 0, exp: 0 };
            cur.setDate(cur.getDate() + 1);
          }
        }
      }

      let totalExp = 0;
      logs.forEach(item => {
        const dayKey = String(item.date || '').split(' ')[0];
        if (!dayKey) return;
        const key = useMonthly ? dayKey.slice(0, 7) : dayKey;
        if (!bucketMap[key]) bucketMap[key] = { key, inc: 0, exp: 0 };
        const amt = Math.abs(Number(item.amount) || 0);
        if (item.type === '收入') bucketMap[key].inc += amt;
        else if (item.type === '支出') {
          bucketMap[key].exp += amt;
          totalExp += amt;
        }
      });

      const buckets = Object.values(bucketMap).sort((a, b) => a.key.localeCompare(b.key));
      currentTrendBuckets = buckets;

      if (buckets.length === 0) {
        wrap.innerHTML = '<div class="empty-hint" style="padding:18px 0;">此區間尚無收支資料</div>';
        return;
      }

      const avgExpLine = useMonthly
        ? (totalExp / buckets.length)
        : (computeEffectiveDailyAvgStats(logs).avgDaily);
      const allNonZero = buckets.flatMap(b => [b.inc, b.exp]).filter(v => v > 0).sort((a, b) => a - b);
      const maxActual = Math.max(100, avgExpLine, ...buckets.map(b => Math.max(b.inc, b.exp)));
      let maxVal = maxActual;
      if (allNonZero.length >= 4) {
        const n = allNonZero.length;
        const p25 = allNonZero[Math.floor((n - 1) * 0.25)];
        const p75 = allNonZero[Math.floor((n - 1) * 0.75)];
        const p85 = allNonZero[Math.floor((n - 1) * 0.85)];
        const iqr = Math.max(0, p75 - p25);
        const nonOutlierExp = buckets.map(b => b.exp).filter(v => v > 0 && v <= p75 + 1.5 * iqr);
        const robustAvgExp = nonOutlierExp.length > 0
          ? nonOutlierExp.reduce((s, v) => s + v, 0) / buckets.length
          : avgExpLine;
        const normalCap = Math.max(100, robustAvgExp * 3, p75 * 1.45, Math.min(p85 * 1.2, p75 + 1.5 * iqr));
        if (maxActual > normalCap * 1.15) {
          maxVal = Math.round(normalCap);
        }
      } else if (allNonZero.length >= 2) {
        const secondMax = allNonZero[allNonZero.length - 2];
        if (maxActual > secondMax * 2.2) {
          maxVal = Math.round(Math.max(100, secondMax * 1.3));
        }
      }

      const fmtShort = (v) => v >= 1000 ? (v / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(Math.round(v));

      const H = 216;
      const padL = 42, padR = 16, padT = 28, padB = 28;
      const minStep = 46;
      const W = Math.max(400, padL + padR + buckets.length * minStep);
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;
      const step = plotW / buckets.length;
      const barW = Math.max(6, Math.min(14, step * 0.34));

      const avgY = padT + plotH - (Math.min(avgExpLine, maxVal) / maxVal) * plotH;

      let gridHtml = '';
      [0, 0.5, 1].forEach(r => {
        const y = padT + plotH - r * plotH;
        const valLabel = Math.round(maxVal * r);
        const shortLabel = fmtShort(valLabel);
        gridHtml += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="#E5E3DC" stroke-width="1"/>`;
        gridHtml += `<text x="${padL - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="10" fill="#7A7A75" font-family="monospace">${shortLabel}</text>`;
      });

      let barsHtml = '';
      buckets.forEach((b, i) => {
        const cx = padL + step * i + step / 2;
        const incCapped = b.inc > maxVal;
        const expCapped = b.exp > maxVal;
        const incRawH = (Math.min(b.inc, maxVal) / maxVal) * plotH;
        const expRawH = (Math.min(b.exp, maxVal) / maxVal) * plotH;
        const incH = b.inc > 0 ? Math.max(4, incRawH) : 0;
        const expH = b.exp > 0 ? Math.max(4, expRawH) : 0;
        const incY = padT + plotH - incH;
        const expY = padT + plotH - expH;
        const incX = cx - barW - 1;
        const expX = cx + 1;
        const label = useMonthly ? b.key.slice(5) + '月' : b.key.slice(5);

        let capMarks = '';
        let incLabelY = incY - 4;
        let expLabelY = expY - 4;
        if (b.inc > 0 && b.exp > 0 && Math.abs(incLabelY - expLabelY) < 11) {
          if (incLabelY <= expLabelY) {
            incLabelY = Math.min(incLabelY, expLabelY) - 10;
          } else {
            expLabelY = Math.min(incLabelY, expLabelY) - 10;
          }
        }
        if (b.inc > 0) {
          const bx = incX, by = padT;
          if (incCapped) {
            capMarks += `
              <line x1="${(bx - 1).toFixed(1)}" y1="${(by + 9).toFixed(1)}" x2="${(bx + barW + 1).toFixed(1)}" y2="${(by + 4).toFixed(1)}" stroke="#FDFCF9" stroke-width="2.2"/>
              <line x1="${(bx - 1).toFixed(1)}" y1="${(by + 14).toFixed(1)}" x2="${(bx + barW + 1).toFixed(1)}" y2="${(by + 9).toFixed(1)}" stroke="#FDFCF9" stroke-width="2.2"/>
            `;
          }
          capMarks += `<text x="${(bx + barW / 2).toFixed(1)}" y="${incLabelY.toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="#385E4C" font-family="monospace">${fmtShort(b.inc)}</text>`;
        }
        if (b.exp > 0) {
          const bx = expX, by = padT;
          if (expCapped) {
            capMarks += `
              <line x1="${(bx - 1).toFixed(1)}" y1="${(by + 9).toFixed(1)}" x2="${(bx + barW + 1).toFixed(1)}" y2="${(by + 4).toFixed(1)}" stroke="#FDFCF9" stroke-width="2.2"/>
              <line x1="${(bx - 1).toFixed(1)}" y1="${(by + 14).toFixed(1)}" x2="${(bx + barW + 1).toFixed(1)}" y2="${(by + 9).toFixed(1)}" stroke="#FDFCF9" stroke-width="2.2"/>
            `;
          }
          capMarks += `<text x="${(bx + barW / 2).toFixed(1)}" y="${expLabelY.toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="#8C4A32" font-family="monospace">${fmtShort(b.exp)}</text>`;
        }

        barsHtml += `
          <g style="cursor:pointer;" onclick="selectTrendBucket(${i})">
            <rect x="${(padL + step * i).toFixed(1)}" y="${padT}" width="${step.toFixed(1)}" height="${plotH}" fill="transparent"/>
            <rect x="${incX.toFixed(1)}" y="${incY.toFixed(1)}" width="${barW.toFixed(1)}" height="${incH.toFixed(1)}" rx="2" fill="#385E4C"/>
            <rect x="${expX.toFixed(1)}" y="${expY.toFixed(1)}" width="${barW.toFixed(1)}" height="${expH.toFixed(1)}" rx="2" fill="#8C4A32"/>
            ${capMarks}
            <text x="${cx.toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#7A7A75" font-family="monospace">${label}</text>
          </g>
        `;
      });

      let avgLineHtml = '';
      if (avgExpLine > 0) {
        const avgDrawY = Math.min(padT + plotH - 4, Math.max(padT + 2, avgY));
        const avgLabel = `${useMonthly ? '月均' : '日均'} ${fmtShort(avgExpLine)}`;
        const labelW = avgLabel.length * 7.2 + 10;
        const labelX = W - padR - 4;
        const labelY = Math.max(padT + 12, avgDrawY - 5);
        avgLineHtml = `
          <line x1="${padL}" y1="${avgDrawY.toFixed(1)}" x2="${W - padR}" y2="${avgDrawY.toFixed(1)}" stroke="#2C2C2A" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.88"/>
          <rect x="${(labelX - labelW + 2).toFixed(1)}" y="${(labelY - 10).toFixed(1)}" width="${labelW.toFixed(1)}" height="14" rx="3" fill="#FDFCF9" fill-opacity="0.92"/>
          <text x="${labelX.toFixed(1)}" y="${labelY.toFixed(1)}" text-anchor="end" font-size="9.5" font-weight="600" fill="#2C2C2A" font-family="monospace">${avgLabel}</text>
        `;
      }

      const isScrollable = W > 400;
      wrap.innerHTML = `
        <div class="stats-svg-scroll" id="trend-scroll-box">
          <svg class="stats-svg" style="${isScrollable ? `width:${W}px; max-width:none;` : ''}" viewBox="0 0 ${W} ${H}">
            ${gridHtml}
            ${barsHtml}
            ${avgLineHtml}
          </svg>
        </div>
      `;
      const trendScrollBox = document.getElementById('trend-scroll-box');
      if (trendScrollBox && isScrollable) {
        requestAnimationFrame(() => { trendScrollBox.scrollLeft = trendScrollBox.scrollWidth; });
      }
    }

    function selectTrendBucket(idx) {
      const b = currentTrendBuckets[idx];
      if (!b) return;
      const box = document.getElementById('stats-trend-detail');
      if (activeTrendBucketIdx === idx && box.classList.contains('active')) {
        box.classList.remove('active', 'clickable');
        box.removeAttribute('onclick');
        box.innerHTML = '';
        activeTrendBucketIdx = null;
        return;
      }
      activeTrendBucketIdx = idx;
      const hasLogs = (b.inc > 0 || b.exp > 0);
      const net = b.inc - b.exp;
      box.innerHTML = `
        <div class="stats-detail-head">
          <span>${b.key}${hasLogs ? ' <span style="font-size:10.5px; color:var(--muted); font-weight:500;">· 點擊跳至明細 ›</span>' : ''}</span>
          <span>淨額 ${net >= 0 ? '+' : ''}${net.toLocaleString()} 元</span>
        </div>
        <div style="display:flex; justify-content:space-between; color:var(--muted);">
          <span>收入：<b style="color:var(--income);">+${b.inc.toLocaleString()} 元</b></span>
          <span>支出：<b style="color:var(--expense);">-${b.exp.toLocaleString()} 元</b></span>
        </div>
      `;
      box.classList.add('active');
      if (hasLogs) {
        box.classList.add('clickable');
        box.setAttribute('onclick', 'jumpToActiveTrendBucket()');
      } else {
        box.classList.remove('clickable');
        box.removeAttribute('onclick');
      }
    }

    function jumpToActiveTrendBucket() {
      if (activeTrendBucketIdx === null) return;
      const b = currentTrendBuckets[activeTrendBucketIdx];
      if (!b || (b.inc <= 0 && b.exp <= 0)) return;
      const bucketKey = b.key;
      const isMonthly = bucketKey.length === 7;
      const matchDate = (item) => {
        const dk = String(item.date || '').split(' ')[0];
        return isMonthly ? dk.startsWith(bucketKey) : (dk === bucketKey);
      };

      const walletPool = (statsState.range === 'cycle') ? getCurrentCycleWalletLogs() : (appState.logs || []);
      const walletDayItems = walletPool.filter(item =>
        (item.type === '支出' || item.type === '收入') && item.excludeStats !== true && matchDate(item)
      );
      const piggyDayItems = (appState.piggyLogs || []).filter(item =>
        (item.type === '支出' || item.type === '收入') && item.excludeStats !== true &&
        (statsState.ledger !== 'all' || !isInternalClearTransfer(item)) &&
        matchDate(item)
      );

      let goPiggy = false;
      if (statsState.ledger === 'piggy') {
        goPiggy = true;
      } else if (statsState.ledger === 'all') {
        const wSum = walletDayItems.reduce((s, x) => s + Math.abs(Number(x.amount) || 0), 0);
        const pSum = piggyDayItems.reduce((s, x) => s + Math.abs(Number(x.amount) || 0), 0);
        if (pSum > wSum || (walletDayItems.length === 0 && piggyDayItems.length > 0)) goPiggy = true;
      }

      if (goPiggy) {
        const targetLog = piggyDayItems[0];
        if (!targetLog) return;
        const targetDate = String(targetLog.date || '').split(' ')[0];
        openPiggyBankModal();
        const scrollBox = document.getElementById('piggy-scroll-body');
        setTimeout(() => {
          scrollToAndHighlightLog('piggy-log-list', targetLog.id, scrollBox, targetDate);
        }, 60);
        return;
      }

      const walletMatch = walletDayItems[0];
      if (!walletMatch) return;
      const targetDate = String(walletMatch.date || '').split(' ')[0];

      const statsMainCtx = {
        mode: 'stats_main',
        ledger: statsState.ledger,
        range: statsState.range,
        rankMode: statsState.rankMode,
        scrollTop: window.scrollY || 0
      };
      const curSnap = historyStack[historyPointer];
      if (curSnap && curSnap.viewContext && curSnap.viewContext.mode === 'stats_main') {
        curSnap.viewContext = statsMainCtx;
        if (historyPointer < historyStack.length - 1) {
          historyStack = historyStack.slice(0, historyPointer + 1);
        }
      } else {
        pushHistoryStep(statsMainCtx);
      }
      pushHistoryStep({ mode: 'history', highlightLogId: walletMatch.id, highlightDate: targetDate });

      walletSearchState.active = false;
      resetSearchBarInput('wallet');
      switchTab('history', document.querySelectorAll('.nav-tab')[2], true);
      setTimeout(() => {
        scrollToAndHighlightLog('log-list', walletMatch.id, null, targetDate);
      }, 90);
    }

    // 圖表 1：類別 / 支付方式排行橫向進度條（點擊開啟類紀錄頁明細彈窗）
    let currentRankItems = [];
    function getExpenseKeyForRank(item) {
      if (statsState.rankMode === 'category') {
        return String(item.categoryOrNote || '未分類').split('（')[0] || '未分類';
      }
      return String(item.payment || '未指定').trim() || '未指定';
    }

    function renderStatsRankCard(logs) {
      const listEl = document.getElementById('stats-rank-list');
      const map = {};
      let total = 0;

      logs.forEach(item => {
        if (item.type !== '支出') return;
        const amt = Number(item.amount) || 0;
        const key = getExpenseKeyForRank(item);
        if (!map[key]) map[key] = { name: key, sum: 0, count: 0 };
        map[key].sum += amt;
        map[key].count += 1;
        total += amt;
      });

      const items = Object.values(map).sort((a, b) => b.sum - a.sum);
      currentRankItems = items;

      if (items.length === 0) {
        listEl.innerHTML = '<div class="empty-hint" style="padding:14px 0;">此區間尚無支出項目</div>';
        return;
      }

      listEl.innerHTML = items.map((it, idx) => {
        const pct = total > 0 ? Math.round((it.sum / total) * 100) : 0;
        const barW = total > 0 ? Math.max(3, (it.sum / items[0].sum) * 100) : 0;
        return `
          <div class="rank-row" onclick="selectRankItem(${idx})">
            <div class="rank-top">
              <span class="rank-name">${idx + 1}. ${it.name}</span>
              <span class="rank-val"><b>${it.sum.toLocaleString()} 元</b> (${pct}%)</span>
            </div>
            <div class="rank-track">
              <div class="rank-fill" style="width: ${barW.toFixed(1)}%;"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectRankItem(idx) {
      const it = currentRankItems[idx];
      if (!it) return;
      openStatsDetailModal(it.name, 'date', 'desc');
    }

    function updateStatsDetailSortUI() {
      document.getElementById('stats-sort-date').classList.toggle('active', statsDetailState.sortField === 'date');
      document.getElementById('stats-sort-amt').classList.toggle('active', statsDetailState.sortField === 'amount');
      positionSegSlider(document.getElementById('stats-detail-sort-switch'));
    }

    function openStatsDetailModal(rankName, sortField = 'date', sortDir = 'desc') {
      statsDetailState.open = true;
      statsDetailState.rankName = rankName;
      statsDetailState.sortField = sortField;
      statsDetailState.sortDir = sortDir;
      updateStatsDetailSortUI();
      renderStatsDetailModalList();
      document.getElementById('stats-detail-modal').classList.add('active');
      syncAllStatsSliders();
      const sc = document.getElementById('stats-detail-scroll');
      if (sc) sc.scrollTop = 0;
    }

    function closeStatsDetailModal() {
      statsDetailState.open = false;
      const modal = document.getElementById('stats-detail-modal');
      if (modal) modal.classList.remove('active');
    }

    function setStatsDetailSortField(field) {
      statsDetailState.sortField = field;
      statsDetailState.sortDir = 'desc';
      updateStatsDetailSortUI();
      renderStatsDetailModalList();
      const sc = document.getElementById('stats-detail-scroll');
      if (sc) sc.scrollTop = 0;
    }

    function toggleStatsDetailSortDir() {
      statsDetailState.sortDir = (statsDetailState.sortDir === 'desc') ? 'asc' : 'desc';
      updateStatsDetailSortUI();
      renderStatsDetailModalList();
      const sc = document.getElementById('stats-detail-scroll');
      if (sc) sc.scrollTop = 0;

    function renderStatsDetailModalList() {
      const rankName = statsDetailState.rankName;
      const logs = getFilteredStatsLogs().filter(item =>
        item.type === '支出' && getExpenseKeyForRank(item) === rankName
      );

      const dir = (statsDetailState.sortDir === 'asc') ? 1 : -1;
      if (statsDetailState.sortField === 'amount') {
        logs.sort((a, b) => {
          const diff = ((Number(a.amount) || 0) - (Number(b.amount) || 0)) * dir;
          if (diff !== 0) return diff;
          const dayA = String(a.date || '').split(' ')[0];
          const dayB = String(b.date || '').split(' ')[0];
          if (dayA !== dayB) return dayB.localeCompare(dayA);
          return (Number(b.seq) || 0) - (Number(a.seq) || 0);
        });
      } else {
        logs.sort((a, b) => {
          const dayA = String(a.date || '').split(' ')[0];
          const dayB = String(b.date || '').split(' ')[0];
          if (dayA !== dayB) return dayA.localeCompare(dayB) * dir;
          return ((Number(a.seq) || 0) - (Number(b.seq) || 0)) * dir;
        });
      }

      const totalAmt = logs.reduce((acc, cur) => acc + (Number(cur.amount) || 0), 0);
      document.getElementById('stats-detail-title').textContent = rankName;
      document.getElementById('stats-detail-total').textContent = `-${totalAmt.toLocaleString()} 元`;
      document.getElementById('stats-detail-count').textContent = `${logs.length} 筆`;

      const listEl = document.getElementById('stats-detail-list');
      listEl.innerHTML = '';

      if (logs.length === 0) {
        listEl.innerHTML = '<div class="empty-hint">目前篩選條件下無對應明細</div>';
        return;
      }

      logs.forEach(item => {
        const wrapper = document.createElement('div');
        wrapper.className = 'swipe-item-wrapper search-result-row';
        const div = buildLogItemContent(item);

        if (statsState.ledger === 'all' && item._ledger) {
          const titleEl = div.querySelector('.log-title');
          if (titleEl) {
            const srcBadge = document.createElement('span');
            srcBadge.className = 'badge-pay';
            srcBadge.textContent = item._ledger;
            titleEl.insertBefore(srcBadge, titleEl.firstChild);
          }
        }

        div.onclick = () => jumpFromStatsDetail(item.id, item._ledger || '錢包');
        wrapper.appendChild(div);
        listEl.appendChild(wrapper);
      });
    }

    function jumpFromStatsDetail(logId, ledgerLabel) {
      if (ledgerLabel === '存錢筒') {

        const scrollBox = document.getElementById('piggy-scroll-body');

          scrollToAndHighlightLog('piggy-log-list', logId, scrollBox);

      const sc = document.getElementById('stats-detail-scroll');

      const detailCtx = {

        rankName: statsDetailState.rankName,

        sortDir: statsDetailState.sortDir,

      };

      const curSnap = historyStack[historyPointer];

    // ========= 分類 & 支付方式 完整管理 =========
    function openOptionModal(type) {

    function renderOptionModalRows() {
      const container = document.getElementById('option-edit-list');
      container.innerHTML = '';
      const defaultProtectedName = (currentEditingType === 'category') ? '餐飲' : '現金';

      tempModalItems.forEach((item, idx) => {

              <line x1="5" y1="8" x2="19" y2="8"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <line x1="5" y1="16" x2="19" y2="16"></line>
            </svg>

            oninput="tempModalItems[${idx}].currentName = this.value">
