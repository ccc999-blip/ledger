        `;
        container.appendChild(row);
        bindRowDragSort(row, container, tempModalItems, renderOptionModalRows);
      });
    }

    function bindRowDragSort(rowEl, containerEl, dataArray, rerenderFn) {
      const handle = rowEl.querySelector('.drag-handle');
      if (!handle) return;

      handle.addEventListener('pointerdown', function(e) {
        if (dataArray.length < 2) return;
        e.preventDefault();
        handle.setPointerCapture(e.pointerId);

        const rows = Array.from(containerEl.querySelectorAll('.cat-edit-item'));
        const dragIdx = rows.indexOf(rowEl);
        if (dragIdx === -1) return;

        const rects = rows.map(r => r.getBoundingClientRect());
        const rowStep = (rects.length > 1)
          ? Math.max(40, rects[1].top - rects[0].top)
          : Math.max(40, rects[0].height + 8);
        const startY = e.clientY;
        let targetIdx = dragIdx;

        const insertLine = document.createElement('div');
        insertLine.className = 'drag-insert-line';
        containerEl.appendChild(insertLine);

        rowEl.classList.add('dragging');
        rowEl.style.transform = 'translateY(0px) scale(1.02)';

        function updateInsertLine(tIdx) {
          const cRect = containerEl.getBoundingClientRect();
          let lineY = 0;
          if (tIdx === 0) {
            lineY = rects[0].top - cRect.top + containerEl.scrollTop - 4;
          } else if (tIdx > dragIdx) {
            lineY = rects[tIdx].bottom - cRect.top + containerEl.scrollTop + 3;
          } else {
            lineY = rects[tIdx].top - cRect.top + containerEl.scrollTop - 5;
          }
          insertLine.style.top = Math.max(0, lineY) + 'px';
        }

        function updateSiblings(tIdx) {
          rows.forEach((r, i) => {
            if (i === dragIdx) return;
            if (tIdx > dragIdx && i > dragIdx && i <= tIdx) {
              r.style.transform = `translateY(-${rowStep}px)`;
            } else if (tIdx < dragIdx && i >= tIdx && i < dragIdx) {
              r.style.transform = `translateY(${rowStep}px)`;
            } else {
              r.style.transform = 'translateY(0px)';
            }
          });
          updateInsertLine(tIdx);
        }

        updateInsertLine(targetIdx);

        function onMove(ev) {
          const dy = ev.clientY - startY;
          rowEl.style.transform = `translateY(${dy}px) scale(1.02)`;

          const draggedCenterY = rects[dragIdx].top + rects[dragIdx].height / 2 + dy;
          let newTarget = dragIdx;
          for (let i = 0; i < rects.length; i++) {
            const mid = rects[i].top + rects[i].height / 2;
            if (i < dragIdx && draggedCenterY < mid) {
              newTarget = i;
              break;
            }
            if (i > dragIdx && draggedCenterY > mid) {
              newTarget = i;
            }
          }
          if (newTarget !== targetIdx) {
            targetIdx = newTarget;
            updateSiblings(targetIdx);
          }
        }

        function onEnd(ev) {
          handle.removeEventListener('pointermove', onMove);
          handle.removeEventListener('pointerup', onEnd);
          handle.removeEventListener('pointercancel', onEnd);
          try { handle.releasePointerCapture(ev.pointerId); } catch (_) {}

          if (insertLine.parentNode) insertLine.parentNode.removeChild(insertLine);
          rowEl.classList.remove('dragging');
          rows.forEach(r => { r.style.transform = ''; });

          if (targetIdx !== dragIdx) {
            const [movedItem] = dataArray.splice(dragIdx, 1);
            dataArray.splice(targetIdx, 0, movedItem);
          }
          rerenderFn();
        }

        handle.addEventListener('pointermove', onMove);
        handle.addEventListener('pointerup', onEnd);
        handle.addEventListener('pointercancel', onEnd);
      });
    }

    function moveOptionItem(index, dir) {
      const target = index + dir;
      if (target < 0 || target >= tempModalItems.length) return;
      const temp = tempModalItems[index];
      tempModalItems[index] = tempModalItems[target];
      tempModalItems[target] = temp;
      renderOptionModalRows();
    }

    function deleteOptionItem(index) {
      const defaultProtectedName = (currentEditingType === 'category') ? '餐飲' : '現金';
      if (tempModalItems[index].originalName === defaultProtectedName) {
        showAppAlert(`「${defaultProtectedName}」為系統固定預設項目，無法刪除`);
        return;
      }
      tempModalItems.splice(index, 1);
      renderOptionModalRows();
    }

    function addOptionRowInModal() {
      tempModalItems.push({ originalName: null, currentName: '' });
      renderOptionModalRows();
      const list = document.getElementById('option-edit-list');
      list.scrollTop = list.scrollHeight;
    }

    function saveOptionChanges() {
      const hasBlank = tempModalItems.some(item => !(item.currentName || '').trim());
      if (hasBlank) {
        showAppAlert('尚有空白項目未填寫，請輸入名稱或刪除空白列後再儲存。');
        return;
      }

      const finalList = [];
      const renameMap = {};

      for (const item of tempModalItems) {
        const trimmed = (item.currentName || '').trim();
        if (!trimmed) continue;
        if (!finalList.includes(trimmed)) {
          finalList.push(trimmed);
        }
        if (item.originalName && item.originalName !== trimmed) {
          renameMap[item.originalName] = trimmed;
        }
      }

      const isCategory = (currentEditingType === 'category');
      const defaultItem = isCategory ? '餐飲' : '現金';
      if (!finalList.includes(defaultItem)) {
        finalList.unshift(defaultItem);
      }

      if (isCategory) {
        appState.categories = finalList;
      } else {
        appState.payments = finalList;
      }

      if (Object.keys(renameMap).length > 0) {
        const applyRename = (list) => {
          list.forEach(item => {
            if (item.type === '支出') {
              if (isCategory) {
                const oldVal = String(item.categoryOrNote || '');
                if (renameMap[oldVal]) {
                  item.categoryOrNote = renameMap[oldVal];
                } else if (oldVal.includes('（')) {
                  const parts = oldVal.split('（');
                  const baseCat = parts[0];
                  if (renameMap[baseCat]) {
                    item.categoryOrNote = renameMap[baseCat] + '（' + parts.slice(1).join('（');
                  }
                }
              } else {
                const oldPay = String(item.payment || '');
                if (renameMap[oldPay]) {
                  item.payment = renameMap[oldPay];
                }
              }
            }
          });
        };

        applyRename(appState.logs);
        applyRename(appState.piggyLogs);

        if (isCategory) {
          appState.presets.forEach(p => {
            if (renameMap[p.category]) {
              p.category = renameMap[p.category];
            }
          });
        }
      }

      closeOptionModal();
      commitChangeWithVersion();
      renderAll();
    }

    // ========= 常用選項：排序、點入編輯、新增、刪除 =========
    function openPresetManageModal() {
      closeCalcKeyboard();
      tempPresets = (appState.presets || []).map(p => ({
        name: p.name,
        category: p.category,
        amount: p.amount
      }));
      renderPresetManageRows();
      document.getElementById('preset-manage-modal').classList.add('active');
    }

    function closePresetManageModal() {
      document.getElementById('preset-manage-modal').classList.remove('active');
    }

    function renderPresetManageRows() {
      const container = document.getElementById('preset-manage-list');
      container.innerHTML = '';

      if (tempPresets.length === 0) {
        container.innerHTML = '<div class="empty-hint" style="padding:20px 0;">目前沒有常用選項，請點擊下方按鈕新增</div>';
        return;
      }

      tempPresets.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'cat-edit-item';
        row.setAttribute('data-drag-idx', String(idx));
        row.innerHTML = `
          <div class="drag-handle" title="按住上下拖曳排序">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <line x1="5" y1="8" x2="19" y2="8"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <line x1="5" y1="16" x2="19" y2="16"></line>
            </svg>
          </div>
          <div class="preset-manage-info" onclick="openPresetFormModal(${idx})">
            <div style="display:flex; align-items:baseline; gap:6px;">
              <span style="font-weight:600; font-size:14px; color:var(--text);">${item.name}</span>
              <span style="font-size:12px; color:var(--muted);">${item.category}</span>
            </div>
            <div style="font-weight:600; color:var(--expense); font-variant-numeric:tabular-nums;">${Number(item.amount).toLocaleString()} 元</div>
          </div>
          <button type="button" class="btn-icon del" onclick="deletePresetItem(${idx})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        `;
        container.appendChild(row);
        bindRowDragSort(row, container, tempPresets, renderPresetManageRows);
      });
    }

    function movePresetItem(index, dir) {
      const target = index + dir;
      if (target < 0 || target >= tempPresets.length) return;
      const temp = tempPresets[index];
      tempPresets[index] = tempPresets[target];
      tempPresets[target] = temp;
      renderPresetManageRows();
    }

    function deletePresetItem(index) {
      tempPresets.splice(index, 1);
      renderPresetManageRows();
    }

    function openPresetFormModal(index) {
      editingPresetIdx = index;
      const catSelect = document.getElementById('preset-select-category');
      catSelect.innerHTML = '';
      appState.categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        catSelect.appendChild(opt);
      });

      const nameInput = document.getElementById('preset-input-name');
      const amtInput = document.getElementById('preset-input-amount');

      if (index === -1) {
        document.getElementById('preset-form-title').textContent = '新增常用選項';
        nameInput.value = '';
        amtInput.value = '';
        if (appState.categories.includes('餐飲')) {
          catSelect.value = '餐飲';
        } else if (catSelect.options.length > 0) {
          catSelect.selectedIndex = 0;
        }
      } else {
        document.getElementById('preset-form-title').textContent = '編輯常用選項';
        const item = tempPresets[index];
        nameInput.value = item.name;
        amtInput.value = item.amount;
        if (appState.categories.includes(item.category)) {
          catSelect.value = item.category;
        } else if (catSelect.options.length > 0) {
          catSelect.selectedIndex = 0;
        }
      }

      document.getElementById('preset-form-modal').classList.add('active');
    }

    function closePresetFormModal() {
      document.getElementById('preset-form-modal').classList.remove('active');
    }

    function confirmPresetFormItem() {
      const name = document.getElementById('preset-input-name').value.trim();
      const category = document.getElementById('preset-select-category').value;
      const amount = Math.abs(Number(document.getElementById('preset-input-amount').value) || 0);

      if (!name) {
        showAppAlert('請填寫常用選項名稱');
        return;
      }
      if (!amount || amount <= 0) {
        showAppAlert('請填寫大於 0 的金額');
        return;
      }

      const isDuplicate = tempPresets.some((item, idx) => {
        if (idx === editingPresetIdx) return false;
        return (
          String(item.name).trim() === name &&
          String(item.category).trim() === category &&
          Number(item.amount) === amount
        );
      });

      if (isDuplicate) {
        showAppAlert(`已存在完全相同的常用選項：\n「${name}（${category}・${amount.toLocaleString()} 元）」\n請勿重複新增！`);
        return;
      }

      const newObj = { name, category, amount };
      if (editingPresetIdx === -1) {
        tempPresets.push(newObj);
      } else {
        tempPresets[editingPresetIdx] = newObj;
      }

      closePresetFormModal();
      renderPresetManageRows();
    }

    function savePresetListChanges() {
      appState.presets = tempPresets.map(item => ({
        name: String(item.name || '').trim(),
        category: String(item.category || '餐飲').trim(),
        amount: Math.abs(Number(item.amount) || 0)
      }));
      selectedPresetIndex = null;
      closePresetManageModal();
      commitChangeWithVersion();
      renderAll();
    }

    // 全域即時觸控阻尼回饋（確保 iOS Safari 快速輕點也能呈現縮放回彈手感）
    (function initGlobalTouchFeedback() {
      const selector = 'button, .today-spend-row, .piggy-bank-btn, .preset-chip, .rank-row, .stats-kpi-card.clickable, .stats-detail-box.clickable, .date-picker-bar, .preset-manage-info, .amount-input-wrapper, .swipe-item-wrapper.search-result-row .log-item';
      let activeEl = null;
      let pressStart = 0;

      function releaseEl() {
        if (!activeEl) return;
        const el = activeEl;
        activeEl = null;
        const elapsed = Date.now() - pressStart;
        const delay = Math.max(0, 140 - elapsed);
        setTimeout(() => el.classList.remove('is-pressed'), delay);
      }

      document.addEventListener('pointerdown', function(e) {
        const target = e.target && e.target.closest ? e.target.closest(selector) : null;
        if (!target || target.disabled) return;
        if (activeEl && activeEl !== target) activeEl.classList.remove('is-pressed');
        activeEl = target;
        pressStart = Date.now();
        target.classList.add('is-pressed');
      }, { passive: true });

      document.addEventListener('pointerup', releaseEl, { passive: true });
      document.addEventListener('pointercancel', releaseEl, { passive: true });
    })();
  </script>
</body>
</html>
